<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Virtual Try-On</h1>
    
    <div class="main-content">
      <div class="input-section">
        <div class="upload-section">
          <div class="upload-area">
            <label for="person-uploader">Person Image</label>
            <input type="file" id="person-uploader" class="image-uploader" accept="image/*">
            <div class="image-preview-container">
              <img id="person-preview" class="image-preview" src="#" alt="Person preview">
              <span class="preview-text">Image Preview</span>
            </div>
          </div>
          
          <div class="upload-area">
            <label for="product-uploader">Product Image</label>
            <input type="file" id="product-uploader" class="image-uploader" accept="image/*">
            <div class="image-preview-container">
              <img id="product-preview" class="image-preview" src="#" alt="Product preview">
              <span class="preview-text">Image Preview</span>
            </div>
          </div>
        </div>
        <button id="send-image-btn">Perform Try-On</button>
      </div>
      
      <div id="result-section">
        <h2>Result</h2>
        <div id="result-container" class="image-preview-container">
          <img id="result-image" class="image-preview" src="#" alt="Result image">
          <span class="preview-text">Result will be shown here</span>
        </div>
      </div>
    </div>

  </div>
  <script src="/js/main.js"></script>
</body>
</html>
